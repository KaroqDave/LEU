[package]
name = "leu-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
# Builds the contract generator. The shipped helper is built without it.
schema = ["dep:schemars"]

[dependencies]
schemars = { version = "1.2.3", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "leu-contracts"
path = "src/bin/contracts.rs"
required-features = ["schema"]
